name: Hermes Enhancer Benchmark

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install -U pytest

      - name: Run benchmark smoke test
        run: |
          python3 benchmarks/benchmark.py \
            --iterations 100 \
            --warmup 20 \
            --memory-calls 100 \
            --output results/ci-benchmark.json

      - name: Run benchmark tests
        run: python3 -m pytest tests/test_benchmark_suite.py -q

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-enhancer-v0.20.7-benchmark
          path: results/
